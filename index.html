<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tour Visualizer</title>

        <!-- Style imports -->
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div id="app-wrapper">
            <main id="map-container"></main>
            <aside id="sidebar-container">
                <h2>Clicked points</h2>
                <p>
                    Press M to toggle marker placement mode, then click a point
                    on the map to add a marker there.
                </p>
                <ol id="placed-markers-list"></ol>
            </aside>
        </div>

        <!-- Script links -->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="app.js"></script>
    </body>
</html>
